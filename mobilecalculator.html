<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Калькулятор доставки</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 15px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    
    .progress {
      display: flex;
      padding: 20px;
      gap: 5px;
      background: #f8f9fa;
    }
    
    .progress-dot {
      flex: 1;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      transition: background 0.3s;
    }
    
    .progress-dot.active {
      background: #667eea;
    }
    
    .content {
      padding: 20px;
    }
    
    .step {
      display: none;
    }
    
    .step.active {
      display: block;
      animation: fadeIn 0.3s;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .step-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .btn {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      color: #333;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      display: block;
    }
    
    .btn:active {
      transform: scale(0.98);
      background: #f0f0f0;
    }
    
    .btn.selected {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    
    .input-group {
      margin-bottom: 15px;
    }
    
    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 0.95rem;
    }
    
    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
    }
    
    .input-group input:focus,
    .input-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    
    .nav-btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    .nav-btn-back {
      background: #f0f0f0;
      color: #666;
    }
    
    .nav-btn-next {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    
    .nav-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    
    .loading {
      text-align: center;
      padding: 40px 20px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .result-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
    }
    
    .result-card h4 {
      font-size: 1.2rem;
      color: #1a1a2e;
      margin-bottom: 15px;
    }
    
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .result-row:last-child {
      border-bottom: none;
    }
    
    .result-label {
      color: #666;
      font-size: 0.9rem;
    }
    
    .result-value {
      color: #333;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: right;
    }
    
    .total-price {
      font-size: 2rem;
      font-weight: 800;
      color: #10b981;
      text-align: center;
      padding: 20px 0;
    }
    
    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
    }
    
    .submit-btn:active {
      transform: scale(0.98);
    }
    
    .message {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚛 Калькулятор доставки</h1>
      <p>Рассчитайте стоимость за 2 минуты</p>
    </div>
    
    <div class="progress" id="progress">
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>
    
    <div class="content">
      <div class="message" id="message"></div>
      
      <!-- Шаг 1: Материал -->
      <div class="step active" id="step1">
        <div class="step-title">Выберите материал</div>
        <div class="btn-list" id="materialList"></div>
      </div>
      
      <!-- Шаг 2: Тип -->
      <div class="step" id="step2">
        <div class="step-title">Выберите тип</div>
        <div class="btn-list" id="typeList"></div>
      </div>
      
      <!-- Шаг 3: Фракция -->
      <div class="step" id="step3">
        <div class="step-title">Выберите фракцию</div>
        <div class="btn-list" id="fractionList"></div>
      </div>
      
      <!-- Шаг 4: Транспорт -->
      <div class="step" id="step4">
        <div class="step-title">Выберите транспорт</div>
        <div class="btn-list" id="vehicleList"></div>
      </div>
      
      <!-- Шаг 5: Объём -->
      <div class="step" id="step5">
        <div class="step-title">Укажите объём</div>
        <div class="grid-2" id="volumeList"></div>
        <div class="input-group" style="margin-top: 20px;">
          <label>Или введите свой объём (м³):</label>
          <input type="number" id="customVolume" placeholder="Введите м³">
        </div>
      </div>
      
      <!-- Шаг 6: Контакты -->
      <div class="step" id="step6">
        <div class="step-title">Контактные данные</div>
        <div class="input-group">
          <label>Имя</label>
          <input type="text" id="name" placeholder="Ваше имя">
        </div>
        <div class="input-group">
          <label>Телефон</label>
          <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">
        </div>
        <div class="input-group">
          <label>Адрес доставки *</label>
          <input type="text" id="address" placeholder="Город, улица, дом" required>
        </div>
      </div>
      
      <!-- Шаг 7: Результат -->
      <div class="step" id="step7">
        <div class="step-title">Результат расчёта</div>
        <div id="results"></div>
      </div>
      
      <div class="nav-buttons">
        <button class="nav-btn nav-btn-back" id="backBtn" onclick="prevStep()" disabled>← Назад</button>
        <button class="nav-btn nav-btn-next" id="nextBtn" onclick="nextStep()">Далее →</button>
      </div>
    </div>
  </div>
  
  <script>
    // ========== ДАННЫЕ ==========
    const PRODUCT_TREE = {
      "Щебень": {
        "гранитный": ["5-20", "20-40", "40-70", "10-20", "4-8", "5-10", "8-11,2"],
        "известняковый": ["10-20", "20-40", "40-70", "5-20"],
        "доломитовый М400": ["10-20", "20-40"],
        "доломитовый М600": ["10-20", "20-40", "40-70"],
        "без типа": ["5-20", "20-40", "40-70"]
      },
      "ЩПС": {
        "": ["0-20", "0-40", "0-80", "0-63"],
        "С1": ["0-40"],
        "С2": ["0-20"],
        "С4": ["0-80"],
        "С5": ["0-40"]
      },
      "Отсев": {
        "": ["0-5", "0-4", "0-20"],
        "гранитный": ["0-4", "0-5"]
      },
      "Песок": {
        "карьерный": ["2-2,5", "1,5-2,0", "1", "1,2-1,5"],
        "сеяный": ["2-2,5", "2,0-2,5", "1,5-2,0"],
        "намывной": ["2-2,5", "1,5-2,0", "2,5"],
        "обогащенный": ["1,4-2,1"],
        "мелкозернистый": ["1", "1,5-1,9"]
      },
      "ПГС": {
        "природный": ["2,5-3,5", "без фракции"],
        "обогащенный": ["0-70"],
        "": ["0-20", "0-40", "0-50"]
      },
      "Гравий": {
        "": ["5-20", "20-40", "40-70"]
      },
      "Грунт": {
        "плодородный": ["без фракции"],
        "песчаный": ["без фракции"]
      }
    };
    
    const VEHICLES = {
      "Самосвал": { capacity: 20, emoji: "🚛" },
      "Тонар": { capacity: 30, emoji: "🚜" }
    };
    
    const WEBHOOKS = {
      LOGISTICS: "https://brightsideai.app.n8n.cloud/webhook/logistics",
      NOTIFY: "https://brightsideai.app.n8n.cloud/webhook/notification-agent"
    };
    
    // ========== СОСТОЯНИЕ ==========
    let currentStep = 1;
    let selectedMaterial = "";
    let selectedType = "";
    let selectedFraction = "";
    let selectedVehicle = "";
    let selectedVolume = 0;
    let calculationResult = null;
    
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    document.addEventListener('DOMContentLoaded', () => {
      renderMaterials();
      updateUI();
    });
    
    // ========== РЕНДЕРИНГ ШАГОВ ==========
    function renderMaterials() {
      const list = document.getElementById('materialList');
      list.innerHTML = '';
      
      Object.keys(PRODUCT_TREE).forEach(material => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = material;
        btn.onclick = () => selectMaterial(material);
        list.appendChild(btn);
      });
    }
    
    function renderTypes() {
      const list = document.getElementById('typeList');
      list.innerHTML = '';
      
      const types = Object.keys(PRODUCT_TREE[selectedMaterial] || {});
      
      types.forEach(type => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = type || 'без типа';
        btn.onclick = () => selectType(type);
        list.appendChild(btn);
      });
    }
    
    function renderFractions() {
      const list = document.getElementById('fractionList');
      list.innerHTML = '';
      
      const typeKey = selectedType === 'без типа' ? '' : selectedType;
      const fractions = PRODUCT_TREE[selectedMaterial]?.[typeKey] || [];
      
      fractions.forEach(fraction => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = fraction || 'без фракции';
        btn.onclick = () => selectFraction(fraction);
        list.appendChild(btn);
      });
    }
    
    function renderVehicles() {
      const list = document.getElementById('vehicleList');
      list.innerHTML = '';
      
      Object.keys(VEHICLES).forEach(vehicle => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        const v = VEHICLES[vehicle];
        btn.innerHTML = `${v.emoji} ${vehicle}<br><span style="font-size: 0.85rem; opacity: 0.7;">(${v.capacity} м³)</span>`;
        btn.onclick = () => selectVehicle(vehicle);
        list.appendChild(btn);
      });
    }
    
    function renderVolumes() {
      const list = document.getElementById('volumeList');
      list.innerHTML = '';
      
      const capacity = VEHICLES[selectedVehicle]?.capacity || 20;
      [1, 2, 3, 4, 5, 10].forEach(mult => {
        const vol = capacity * mult;
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerHTML = `<strong style="font-size: 1.3rem;">${vol}</strong> м³<br><span style="font-size: 0.8rem; opacity: 0.7;">${mult} ${mult === 1 ? 'рейс' : 'рейса'}</span>`;
        btn.onclick = () => selectVolume(vol);
        list.appendChild(btn);
      });
    }
    
    // ========== ВЫБОР ==========
    function selectMaterial(material) {
      selectedMaterial = material;
      selectedType = "";
      selectedFraction = "";
      renderTypes();
      nextStep();
    }
    
    function selectType(type) {
      selectedType = type;
      selectedFraction = "";
      renderFractions();
      nextStep();
    }
    
    function selectFraction(fraction) {
      selectedFraction = fraction;
      renderVehicles();
      nextStep();
    }
    
    function selectVehicle(vehicle) {
      selectedVehicle = vehicle;
      renderVolumes();
      nextStep();
    }
    
    function selectVolume(volume) {
      selectedVolume = volume;
      document.getElementById('customVolume').value = volume;
      nextStep();
    }
    
    // Кастомный объём
    document.addEventListener('input', (e) => {
      if (e.target.id === 'customVolume') {
        const val = parseInt(e.target.value) || 0;
        if (val > 0) selectedVolume = val;
      }
    });
    
    // ========== НАВИГАЦИЯ ==========
    function nextStep() {
      if (currentStep < 7) {
        currentStep++;
        showStep(currentStep);
        updateUI();
        
        if (currentStep === 7) {
          calculate();
        }
      }
    }
    
    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        showStep(currentStep);
        updateUI();
      }
    }
    
    function showStep(step) {
      // Скрыть все шаги
      for (let i = 1; i <= 7; i++) {
        document.getElementById(`step${i}`).classList.remove('active');
      }
      // Показать текущий
      document.getElementById(`step${step}`).classList.add('active');
    }
    
    function updateUI() {
      // Прогресс бар
      const dots = document.querySelectorAll('.progress-dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx < currentStep);
      });
      
      // Кнопки навигации
      document.getElementById('backBtn').disabled = currentStep === 1;
      
      const nextBtn = document.getElementById('nextBtn');
      if (currentStep === 7) {
        nextBtn.style.display = 'none';
      } else {
        nextBtn.style.display = 'block';
      }
    }
    
    // ========== РАСЧЁТ ==========
    async function calculate() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div style="color: #666; font-weight: 600;">Рассчитываем...</div>
          <div style="color: #999; font-size: 0.9rem; margin-top: 10px;">Это займёт 20-30 секунд</div>
        </div>
      `;
      
      try {
        const address = document.getElementById('address').value.trim();
        if (!address) {
          showMessage('Укажите адрес доставки', 'error');
          currentStep = 6;
          showStep(6);
          updateUI();
          return;
        }
        
        const payload = {
          customer: {
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            address: address
          },
          request: {
            product: selectedMaterial,
            type: selectedType === 'без типа' ? '' : selectedType,
            subtype2: selectedFraction === 'без фракции' ? '' : selectedFraction,
            vehicleType: selectedVehicle,
            quantity: selectedVolume
          }
        };
        
        const response = await fetch(WEBHOOKS.LOGISTICS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
        
        const data = await response.json();
        const offers = Array.isArray(data) ? data : [data];
        
        if (offers.length === 0 || offers[0]?.error) {
          throw new Error(offers[0]?.message || 'Не удалось рассчитать стоимость');
        }
        
        calculationResult = offers[0];
        displayResults(offers);
        
      } catch (error) {
        console.error(error);
        const errorMsg = error.message;
        const isRouteLimit = errorMsg.includes('не может ехать') || errorMsg.includes('максимум') || errorMsg.includes('минимум');
        
        resultsDiv.innerHTML = `
          <div style="background: ${isRouteLimit ? '#fff3cd' : '#f8d7da'}; padding: 20px; border-radius: 12px; color: ${isRouteLimit ? '#856404' : '#721c24'}; text-align: center;">
            <div style="font-size: 2rem; margin-bottom: 10px;">${isRouteLimit ? '🚫' : '❌'}</div>
            <div style="font-weight: 600; margin-bottom: 10px;">${isRouteLimit ? 'Превышение лимита маршрута' : 'Ошибка расчёта'}</div>
            <div style="font-size: 0.9rem;">${errorMsg.replace('❌ ', '').replace('🚫 ', '')}</div>
            <button class="nav-btn nav-btn-back" onclick="prevStep()" style="margin-top: 20px; width: 100%;">← Назад</button>
          </div>
        `;
      }
    }
    
    function displayResults(offers) {
      const resultsDiv = document.getElementById('results');
      let html = '';
      
      // Кнопка отправки заявки вверху
      html += `<button class="submit-btn" onclick="submitOrder()" style="margin-bottom: 25px;">✅ Отправить заявку</button>`;
      
      offers.forEach((offer, idx) => {
        const isBest = idx === 0;
        
        html += `
          <div class="result-card" style="${isBest ? 'border-left: 4px solid #10b981;' : ''}">
            <h4>${isBest ? '⭐ ' : ''}${offer.supplier || 'Поставщик'}</h4>
            
            <div class="result-row">
              <div class="result-label">Материал</div>
              <div class="result-value">${offer.fullProductName || '-'}</div>
            </div>
            
            <div class="result-row">
              <div class="result-label">Объём</div>
              <div class="result-value">${offer.quantity || 0} м³</div>
            </div>
            
            <div class="result-row">
              <div class="result-label">Вес</div>
              <div class="result-value">${(offer.deliveredWeightTons || 0).toFixed(1)} т</div>
            </div>
            
            <div class="result-row">
              <div class="result-label">Транспорт</div>
              <div class="result-value">${offer.vehicleType || '-'} (${offer.trips || 0} рейса)</div>
            </div>
            
            <div class="result-row">
              <div class="result-label">Расстояние</div>
              <div class="result-value">${(offer.distanceKm || 0).toFixed(1)} км</div>
            </div>
            
            <div class="result-row">
              <div class="result-label">Время в пути</div>
              <div class="result-value">${offer.durationMin || 0} мин</div>
            </div>
            
            <div class="result-row">
              <div class="result-label">Ставка доставки</div>
              <div class="result-value">${offer.vehicleType === 'Тонар' && offer.tonarRate ? offer.tonarRate + ' ₽/т·км' : offer.vehicleType === 'Самосвал' ? 'По объёму' : '-'}</div>
            </div>
            
            <div class="result-row">
              <div class="result-label">Стоимость материала</div>
              <div class="result-value" style="color: #059669;">${(offer.productCost || 0).toLocaleString()} ₽</div>
            </div>
            
            <div class="result-row">
              <div class="result-label">Стоимость доставки</div>
              <div class="result-value" style="color: #3b82f6;">${(offer.adjustedDeliveryCost || 0).toLocaleString()} ₽</div>
            </div>
            
            <div class="total-price">
              ${(offer.adjustedTotalCost || 0).toLocaleString()} ₽
            </div>
            
            <div style="text-align: center; font-size: 0.9rem; color: #666; margin-top: 10px;">
              ${(offer.priceWithDeliveryPerM3 || 0).toLocaleString()} ₽/м³ с доставкой
            </div>
          </div>
        `;
      });
      
      resultsDiv.innerHTML = html;
    }
    
    // ========== ОТПРАВКА ЗАЯВКИ ==========
    async function submitOrder() {
      if (!calculationResult) {
        showMessage('Нет данных для отправки', 'error');
        return;
      }
      
      try {
        const orderData = {
          material: selectedMaterial,
          type: selectedType,
          fraction: selectedFraction,
          vehicle: selectedVehicle,
          requestedVolume: selectedVolume,
          actualVolume: calculationResult.quantity,
          trips: calculationResult.trips,
          name: document.getElementById('name').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          address: document.getElementById('address').value.trim(),
          materialCost: calculationResult.productCost,
          deliveryCost: calculationResult.adjustedDeliveryCost,
          totalCost: calculationResult.adjustedTotalCost,
          priceWithDeliveryPerM3: calculationResult.priceWithDeliveryPerM3,
          distance: calculationResult.distanceKm,
          duration: calculationResult.durationMin,
          supplier: calculationResult.supplier,
          timestamp: new Date().toISOString()
        };
        
        const response = await fetch(WEBHOOKS.NOTIFY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        
        if (!response.ok) throw new Error('Ошибка отправки');
        
        showMessage('✅ Заявка отправлена! Мы свяжемся с вами в ближайшее время.', 'success');
        
        setTimeout(() => {
          resetForm();
        }, 3000);
        
      } catch (error) {
        console.error(error);
        showMessage('Ошибка отправки: ' + error.message, 'error');
      }
    }
    
    // ========== УТИЛИТЫ ==========
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
      
      setTimeout(() => {
        msg.style.display = 'none';
      }, 5000);
    }
    
    function resetForm() {
      currentStep = 1;
      selectedMaterial = "";
      selectedType = "";
      selectedFraction = "";
      selectedVehicle = "";
      selectedVolume = 0;
      calculationResult = null;
      
      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('address').value = '';
      document.getElementById('customVolume').value = '';
      
      showStep(1);
      updateUI();
      renderMaterials();
    }
  </script>
</body>
</html>
